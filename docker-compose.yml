services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: raceday-web
    container_name: raceday
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ApiSettings__BaseUrl=${API_BASE_URL:-http://host.docker.internal:5065/}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
