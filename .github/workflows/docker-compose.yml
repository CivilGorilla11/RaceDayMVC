name: Docker Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find the Dockerfile
        run: |
          DOCKERFILE=$(find . -type f -name Dockerfile -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$DOCKERFILE" ]; then
            echo "No Dockerfile found in the repository. Is it committed? (check .gitignore and git status)"
            exit 1
          fi
          echo "Using Dockerfile: $DOCKERFILE"
          echo "DOCKERFILE=$DOCKERFILE" >> "$GITHUB_ENV"

      - name: Build the Docker image
        run: |
          # First try the folder the Dockerfile sits in, then the repository root
          if docker build -f "$DOCKERFILE" -t raceday-web:ci "$(dirname "$DOCKERFILE")"; then
            echo "Built using the Dockerfile's own folder as the build context"
          else
            echo "Retrying with the repository root as the build context"
            docker build -f "$DOCKERFILE" -t raceday-web:ci .
          fi

      - name: Start the container
        run: |
          docker run -d --name raceday -P \
            -e ApiSettings__BaseUrl=http://localhost:9999/ \
            raceday-web:ci
          sleep 3
          docker ps
          docker port raceday

      - name: Check the app answers
        run: |
          # Give the container 5-10 seconds to fully initialize
           sleep 5
    
          PORT=$(docker port raceday | head -n 1 | sed 's/.*://')
          echo "App is published on port $PORT"
    
          # Optional: add a curl retry loop
          for i in {1..5}; do
          response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:$PORT)
          if [ "$response" -eq 200 ]; then
          echo "App returned HTTP 200 successfully!"
          exit 0
          fi
          echo "Waiting for app to respond... (Attempt $i)"
          sleep 3
          done
    
          exit 1

      - name: Show container logs if something failed
        if: failure()
        run: docker logs raceday || true
